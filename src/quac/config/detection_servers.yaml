quac:
  hazmat_detection_server:
    ros__parameters:
      object_name: "hazmat_sign"
      camera_names: ["camera_front", "camera_back"]
      mapping: true
      publish_rate: 10
      publish_images_period: 10
      reference_frame: "map"
      consideration_radius: 2.0
      detection_weight: 0.01
      confidence_threshold: 0.5

  paintroller_detection_server:
    ros__parameters:
      object_name: "paintroller"
      camera_names: ["camera_front"]
      mapping: false # true
      publish_rate: 10
      publish_images_period: 10
      reference_frame: "map"
      consideration_radius: 0.05
      detection_weight: 0.01
      confidence_threshold: 0.5

  qrcode_detection_server:
    ros__parameters:
      object_name: "qrcode"
      camera_names: ["camera_front", "camera_back"]
      mapping: true
      publish_rate: 10
      publish_images_period: 10
      reference_frame: "map"  
      consideration_radius: 2.0
      detection_weight: 0.01