quac:
  camera_front:
    ros__parameters:
      capture:
        device_id: "19443010218B077E00"
        fps: 30
        color:
          width: 640
          height: 480
        depth:
          width: 640
          height: 480
      gst:
        port: 5000
        width: 640 #1920
        height: 480 #1080
        compression: "h264"
        h264:
          bitrate: 5000
          key_int_max: 10
      pointcloud:
        enable: false
        interval: 10
        frame: camera_front_depth_optical_frame
      image:
        enable: true
        interval: 3
        frame: camera_front_color_optical_frame
        
