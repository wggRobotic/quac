quac:
  ekf_filter_node:
    ros__parameters:
      frequency: 30.0
      sensor_timeout: 0.1
      two_d_mode: true
      publish_tf: true
      publish_acceleration: false

      map_frame: map
      odom_frame: odom
      base_link_frame: base_link
      world_frame: odom

      odom0: odom
      odom0_config: [
        false, false, false,      # position: x, y, z
        false, false, true,    # orientation: roll, pitch, yaw
        true,  true,  false,    # linear velocity: vx, vy, vz
        false, false, true,    # angular velocity: roll rate, pitch rate, yaw rate
        false, false, false     # linear acceleration: ax, ay, az 
      ]

      imu0: camera_front/imu
      imu0_config: [
        false, false, false,    # position: x, y, z
        false, false, false,     # orientation: roll, pitch, yaw
        false, false, false,    # linear velocity: vx, vy, vz
        true, true, true,     # angular velocity: roll rate, pitch rate, yaw rate
        false, false, true,      # linear acceleration: ax, ay, az 
      ]

      imu0_differential: false
      imu0_relative: false
      imu0_remove_gravitational_acceleration: true